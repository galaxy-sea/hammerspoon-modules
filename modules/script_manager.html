0;padding:0 12px 10px}.group summary{cursor:pointer;font-weight:600;padding:12px 0}.row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.label{width:155px;flex-shrink:0;overflow-wrap:anywhere;line-height:1.5}.row input:not([type=checkbox]){flex:1;width:0}.row select{max-width:115px}.remove{padding:4px 8px;color:var(--muted);background:none;border:0}.remove:hover{color:var(--danger)}.add{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:10px}.add input{flex:1;width:120px}.small{font-size:11px;color:var(--muted)}.nested{min-width:0}.nested>.group{background:transparent}.group-heading{display:flex;gap:8px;align-items:center;justify-content:space-between}.group-heading span{overflow-wrap:anywhere}.empty{color:var(--muted);padding:10px 0;font-size:12px}footer{padding:14px 28px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--card)}#notice{flex:1;color:var(--muted);font-size:12px;overflow-wrap:anywhere}#notice.bad{color:var(--danger)}.footer-actions{display:flex;align-items:center;gap:12px}.welcome{padding:40px;color:var(--muted)}
.parameter-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:12px 0}.parameter-card h3{font-size:14px;margin:0 0 18px}.parameter-line{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0}.parameter-line+.parameter-line{border-top:1px solid var(--line)}.shortcut-row{display:flex;align-items:center;gap:10px;overflow-x:auto;padding:2px 0}.modifiers{display:flex;gap:6px;flex-wrap:nowrap;flex-shrink:0}.modifier span{white-space:nowrap}.modifier{display:flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer}.modifier:has(input:checked){background:var(--soft);border-color:var(--accent)}.modifier input{width:14px;height:14px;margin:0}.key-input{width:56px;flex:0 0 56px;text-align:center;font-weight:600}.shortcut-preview{margin-left:auto;padding:7px 10px;background:var(--bg);border-radius:8px;white-space:nowrap;flex-shrink:0}.shortcut-preview kbd{font:600 17px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink)}
.parameter-field{display:grid;grid-template-columns:180px minmax(0,1fr);align-items:center;gap:16px;padding:12px 0}.parameter-field+.parameter-field{border-top:1px solid var(--line)}.field-label{line-height:1.5}.field-text{width:100%}.field-number{width:120px;text-align:right}.field-list{min-width:0}.list-item{display:flex;align-items:center;gap:6px;margin-bottom:7px}.list-item input{flex:1;min-width:0;width:0}.list-remove{border:0;background:none;font-size:19px;color:var(--muted);padding:3px 8px}.list-remove:hover{color:var(--danger)}.list-add{font-size:12px;border-style:dashed;padding:5px 10px}.advanced-parameters summary{cursor:pointer;font-weight:600}.advanced-parameters[open] summary{margin-bottom:8px}
.installation-guide summary{cursor:pointer;font-weight:600}.installation-guide p{color:var(--muted);line-height:1.7;margin:12px 0 0}.install-command{background:var(--bg);padding:12px;border-radius:7px;white-space:pre-wrap;user-select:text;font-size:12px}

.dynamic-options{min-width:0}.dynamic-options select,.dynamic-options input{display:block;width:100%}.dynamic-options input{margin-top:7px;font-size:12px;color:var(--muted)}.field-list>.list-add+.list-add{margin-left:6px}.map-list{margin:24px 0}.map-list>h3{font-size:14px}
@media(max-width:780px){aside{width:170px}.scroll{padding:20px 16px}.label{width:115px}footer{padding:12px 16px;flex-wrap:wrap}.row{flex-wrap:wrap}.parameter-field{grid-template-columns:140px minmax(0,1fr);gap:12px}}
#navigation{flex:1;min-height:0;overflow:auto}.sidebar-actions{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.sidebar-actions button{text-align:left}
</style>
<div class="layout">
<aside><h1>小脚本设置</h1><p class="caption">按需开启，轻装运行。</p><nav id="navigation"></nav><div class="sidebar-actions"><button id="reload-config" type="button">重载配置</button><button id="open-console" type="button">控制台日志</button></div></aside>
<main><div class="scroll" id="content"><p class="welcome">正在读取配置…</p></div><footer><span id="notice">配置保存在 .hammerspoon/script_settings.json。</span><div class="footer-actions"><button id="reset" disabled>恢复默认</button><span id="script-enabled"></span><button class="primary" id="save" disabled>保存并应用</button></div></footer></main>
</div>
<script>
'use strict';
let modules=[], selected=null, drafts={}, dirty={}, busy=false;
const applicationNames={};
const choiceRefreshers=new Set();
const choiceSources=new Set();
const optionResources=new Map();
const applicationRequests=new Map();
let applicationRequestID=0;
const labels={string:'文字',number:'数字',boolean:'开关',array:'列表',object:'分组'};
const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const clone=value=>value===undefined?undefined:JSON.parse(JSON.stringify(value));
const entry=()=>modules.find(item=>item.id===selected);
function notice(message,bad=false){const e=document.getElementById('notice');e.textContent=message;e.className=bad?'bad':''}
function mark(){dirty[selected]=true;document.getElementById('save').disabled=busy;notice('有未保存的修改。')}
function send(body){window.webkit.messageHandlers.scriptManager.postMessage(body)}
function kindOf(value){return Array.isArray(value)?'array':(value!==null&&typeof value==='object'?'object':typeof value)}
function initial(kind){return{string:'',number:0,boolean:false,array:[],object:{}}[kind]}
function safeKey(key){return key&&!['__proto__','constructor','prototype'].includes(key)}
function normalize(value,key){
 if(key==='options'&&Array.isArray(value)&&!value.length)return {};
 return value;
}
function renderNavigation(){
 const nav=document.getElementById('navigation');nav.replaceChildren();
 for(const item of modules){const b=make('button','nav'+(selected===item.id?' selected':''));b.type='button';const dot=make('span','dot'+(item.error?' error':item.running?' on':''));b.append(dot,make('span','',item.title));b.onclick=()=>{if(busy)return;selected=item.id;renderNavigation();renderEditor()};nav.append(b)}
}
function typePicker(value,onChange){const picker=make('select');picker.setAttribute('aria-label','值类型');for(const [type,label]of Object.entries(labels)){const option=make('option','',label);option.value=type;picker.append(option)}picker.value=kindOf(value);picker.onchange=()=>onChange(initial(picker.value));return picker}
function renderValue(parent,key,value,set,remove,path){
 const title=typeof key==='number'?'第 '+(key+1)+' 项':key;
 const kind=kindOf(value);
 const erase=make('button','remove','删除');erase.type='button';erase.onclick=()=>{remove();mark();renderEditor()};
 if(kind==='array'||kind==='object'){
  const details=make('details','group');details.open=path.length<3;
  const summary=make('summary');summary.textContent=title;details.append(summary);
  const body=make('div','nested');details.append(body);renderCollection(body,value,path,set);
  const bottom=make('div','add');bottom.append(erase);details.append(bottom);parent.append(details);return;
 }
 const row=make('div','row');const label=make('label','label',title);row.append(label);
 const input=make('input');input.type=kind==='boolean'?'checkbox':kind==='number'?'number':'text';input.spellcheck=false;
 if(kind==='boolean')input.checked=value;else input.value=value;
 label.htmlFor=input.id='field-'+Math.random().toString(36).slice(2);
 if(kind==='number')input.step='any';
 input.oninput=()=>{if(kind==='number'&&(!input.value.trim()||!Number.isFinite(Number(input.value)))){input.setCustomValidity('请输入有效数字');return}input.setCustomValidity('');set(kind==='boolean'?input.checked:kind==='number'?Number(input.value):input.value);mark()};
 row.append(input,typePicker(value,v=>{set(v);mark();renderEditor()}),erase);parent.append(row);
}
function renderCollection(parent,value,path,set){
 const array=Array.isArray(value);const keys=Object.keys(value);
 if(!keys.length)parent.append(make('div','empty',array?'列表为空，点击下方添加。':'暂无设置，可添加需要的配置项。'));
 for(const key of keys){const index=array?Number(key):key;renderValue(parent,index,value[key],v=>value[key]=v,()=>{if(array)value.splice(index,1);else delete value[key]},[...path,key])}
 const add=make('div','add');let keyInput;
 if(!array){keyInput=make('input');keyInput.placeholder='设置名称';keyInput.setAttribute('aria-label','新设置名称');add.append(keyInput)}
 const picker=typePicker('',()=>{});picker.value=array&&value.length?kindOf(value[0]):'string';
 const button=make('button','',array?'＋ 添加一项':'＋ 添加设置');button.type='button';
 button.onclick=()=>{const key=array?value.length:keyInput.value.trim();if(!array&&(!safeKey(key)||Object.hasOwn(value,key))){notice('请输入不重复的有效设置名称。',true);return}
 let v=initial(picker.value);
 value[key]=v;set(value);mark();renderEditor()};
 add.append(picker,button);parent.append(add);
}
window.receiveApplication=result=>{
 if(result.request&&applicationRequests.has(result.request)){
  const callback=applicationRequests.get(result.request);applicationRequests.delete(result.request);
  if(result.application)applicationNames[result.application.id]=result.application.name;
  callback(result.application||null);if(result.error&&selected===result.id)notice(result.error,true);return;
 }
 const draft=drafts[result.id];
 if(result.application&&draft){
  draft.options[result.key]=result.application.id;dirty[result.id]=true;
  applicationNames[result.application.id]=result.application.name;
 }
 if(selected===result.id){renderEditor();if(result.error)notice(result.error,true);}
};
function renderApplicationPicker(parent,parameter,value,config){
 const control=make('div','application-picker');const line=make('div','application-choice');
 const browse=make('button','','在访达中选择…');browse.type='button';
 const name=make('span','small',applicationNames[value]||'');
 const identifier=make('input','application-id');identifier.type='text';identifier.value=value||'';identifier.placeholder='或手动输入 Bundle ID';identifier.spellcheck=false;identifier.id='parameter-'+parameter.key;
 identifier.setAttribute('aria-label','应用 Bundle ID');
 identifier.oninput=()=>{config[parameter.key]=identifier.value;name.textContent=applicationNames[identifier.value]||'';mark()};
 browse.onclick=()=>{browse.disabled=true;send({action:'chooseApplication',id:selected,key:parameter.key})};
 line.append(browse,name);control.append(line,identifier);parent.append(control);
}
function optionSelect(options,value,onChange){
 const select=make('select');const choices=options.map(option=>typeof option==='string'?{value:option,label:option}:option);
 if(value!==undefined&&!choices.some(option=>option.value===value))choices.push({value,label:value});
 for(const option of choices){const item=make('option','',option.label);item.value=option.value;select.append(item)}
 select.value=value;select.onchange=()=>onChange(select.value);return select;
}
function refreshChoices(){for(const refresh of choiceRefreshers)refresh()}
function requestApplication(callback){
 const request='application-'+(++applicationRequestID);applicationRequests.set(request,callback);
 send({action:'chooseApplication',id:selected,request});
}
function resourceFor(source){
 if(!optionResources.has(source))optionResources.set(source,{options:null,loading:false,listeners:new Set()});
 return optionResources.get(source);
}
window.receiveOptions=result=>{
 const resource=resourceFor(result.source);resource.options=Array.isArray(result.options)?result.options:[];resource.loading=false;
 for(const refresh of resource.listeners)refresh();
};
function renderDynamicOptions(parent,parameter,value,changed,cleanup){
 const resource=resourceFor(parameter.options);const control=make('div','dynamic-options');const select=make('select');select.setAttribute('aria-label',parameter.label);
 const input=make('input');input.type='text';input.value=value||'';input.placeholder='也可手动填写';input.spellcheck=false;input.setAttribute('aria-label',parameter.label+' ID');
 function fill(){
  select.replaceChildren();const blank=make('option','',resource.loading?'正在读取…':'请选择');blank.value='';select.append(blank);
  const choices=resource.options||[];for(const choice of choices){const option=make('option','',choice.label);option.value=choice.value;select.append(option)}
  if(input.value&&!choices.some(choice=>choice.value===input.value)){const option=make('option','',input.value);option.value=input.value;select.append(option)}
  select.value=input.value;select.disabled=resource.loading&&resource.options===null;
 }
 select.onchange=()=>{input.value=select.value;changed(input.value)};
 input.oninput=()=>{select.value=input.value;changed(input.value)};
 resource.listeners.add(fill);if(cleanup)cleanup.push(()=>resource.listeners.delete(fill));
 control.append(select,input);parent.append(control);
 if(resource.options===null&&!resource.loading){resource.loading=true;send({action:'options',source:parameter.options})}
 fill();
}
function renderDeclaredField(parent,parameter,config,scope,changed,cleanup){
 const notify=()=>{mark();if(changed)changed()};
 const value=config[parameter.key]===undefined?clone(parameter.default):config[parameter.key];
 const row=make('div','parameter-field');const label=make('label','field-label',parameter.label);row.append(label);
 if(parameter.options==='application'){renderApplicationPicker(row,parameter,value,config);parent.append(row);return;}
 if(typeof parameter.options==='string'){
  renderDynamicOptions(row,parameter,value,next=>{config[parameter.key]=next;notify()},cleanup);parent.append(row);return;
 }
 const listDefault=Array.isArray(parameter.default)||(parameter.default&&typeof parameter.default==='object'&&Object.keys(parameter.default).length===0);
 if(listDefault){
  const values=Array.isArray(value)?clone(value):typeof value==='string'?[value]:[];
  const control=make('div','field-list');const items=make('div');const add=make('button','list-add','＋ 添加');add.type='button';
  const save=()=>{
   if(!values.length&&parameter.omitEmpty)delete config[parameter.key];
   else config[parameter.key]=clone(values);
   notify();if(choiceSources.has(parameter.key))refreshChoices();
  };
  function draw(){
   items.replaceChildren();
   values.forEach((item,index)=>{
    const line=make('div','list-item');let input;
    if(Array.isArray(parameter.options))input=optionSelect(parameter.options,item,next=>{values[index]=next;save()});
    else{input=make('input');input.type=typeof item==='number'?'number':'text';input.value=item;input.spellcheck=false;if(input.type==='number')input.step='any';input.oninput=()=>{values[index]=typeof item==='number'?Number(input.value):input.value;save()};}
    input.setAttribute('aria-label',parameter.label+' '+(index+1));
    const remove=make('button','list-remove','×');remove.type='button';remove.setAttribute('aria-label','删除'+parameter.label+' '+(index+1));
    remove.onclick=()=>{values.splice(index,1);save();draw()};line.append(input);
    line.append(remove);items.append(line);
   });
  }
  add.onclick=()=>{
   const candidates=Array.isArray(parameter.options)?parameter.options.map(option=>typeof option==='string'?option:option.value):null;
   values.push(candidates?(candidates.find(option=>!values.includes(option))??candidates[0]):typeof parameter.default[0]==='number'?0:'');save();draw();
  };
  draw();control.append(items,add);
  if(parameter.item?.options==='application'){
   const browse=make('button','list-add','在访达中添加…');browse.type='button';browse.setAttribute('aria-label','选择'+parameter.label);
   browse.onclick=()=>{browse.disabled=true;requestApplication(app=>{browse.disabled=false;if(app&&!values.includes(app.id)){values.push(app.id);save();draw()}})};control.append(browse);
  }
  row.append(control);
 }else if(Array.isArray(parameter.options)){
  const select=optionSelect(parameter.options,value,next=>{config[parameter.key]=next;notify()});select.setAttribute('aria-label',parameter.label);row.append(select);
 }else{
  const input=make('input',typeof parameter.default==='number'?'field-number':'field-text');input.type=typeof parameter.default==='boolean'?'checkbox':typeof parameter.default==='number'?'number':'text';
  if(input.type==='checkbox')input.checked=!!value;else input.value=value;
  if(input.type==='number')input.step='any';input.spellcheck=false;label.htmlFor=input.id=(scope?scope+'-':'parameter-')+parameter.key;
  input.oninput=()=>{config[parameter.key]=input.type==='checkbox'?input.checked:input.type==='number'?Number(input.value):input.value;notify()};row.append(input);
 }
 parent.append(row);
}
function findParameter(parameters,key){
 for(const parameter of Array.isArray(parameters)?parameters:[]){
  if(parameter.key===key)return parameter;
  const nested=findParameter(parameter.fields,key);if(nested)return nested;
 }
 return null;
}
function collectChoiceSources(parameters){
 for(const parameter of Array.isArray(parameters)?parameters:[]){if(parameter.selection)choiceSources.add(parameter.selection.source);collectChoiceSources(parameter.fields)}
}
function renderSelection(parent,parameter,record,root){
 const field=make('div','selection-field');field.append(make('label','field-label',parameter.label));const body=make('div');field.append(body);
 const key=parameter.key;const source=parameter.selection.source;
 const sourceParameter=findParameter(entry()?.parameters,source);
 const sourceValues=name=>{
  const declared=findParameter(entry()?.parameters,name);
  return Array.isArray(root[name])?root[name]:Array.isArray(declared?.default)?declared.default:[];
 };
 const labelFor=value=>{const option=(parameter.options||sourceParameter?.options||[]).find(item=>(typeof item==='string'?item:item.value)===value);return typeof option==='string'?option:option?.label||value};
 function render(){
  body.replaceChildren();const current=record[key];const globals=sourceValues(source);
  const condition=parameter.disabledWhen;
  if(condition){const actual=record[condition.key]===undefined?sourceValues(condition.source)[0]:record[condition.key];if(condition.values.includes(actual)){body.append(make('p','small',condition.message));return;}}
  const sentinel=parameter.selection.choose;
  const mode=Array.isArray(current)?'custom':current===sentinel?'choose':current===undefined?'default':'fixed';
  const picker=optionSelect([{value:'default',label:'使用默认项'},{value:'fixed',label:'固定选择'},{value:'choose',label:'每次选择'},{value:'custom',label:'自定义选择列表'}],mode,next=>{
   if(next==='default')delete record[key];else if(next==='choose')record[key]=sentinel;else if(next==='custom')record[key]=clone(globals);else record[key]=globals[0]||'';
   mark();refreshChoices();
  });picker.setAttribute('aria-label',parameter.label+'选择方式');body.append(picker);
  if(mode==='default')body.append(make('p','small','默认：'+(labelFor(globals[0])||'未设置')));
  else if(mode==='choose')body.append(make('p','small','打开时从全局列表选择。'));
  else if(mode==='fixed'){
   if(Array.isArray(parameter.options)){
    const options=clone(parameter.options);for(const value of [...globals,current])if(!options.some(option=>(typeof option==='string'?option:option.value)===value))options.push({value,label:labelFor(value)});
    const select=optionSelect(options,current,next=>{record[key]=next;mark();refreshChoices()});select.setAttribute('aria-label','固定'+parameter.label);body.append(select);
   }else{const input=make('input');input.type='text';input.value=current;input.setAttribute('aria-label','固定'+parameter.label);input.oninput=()=>{record[key]=input.value;mark()};body.append(input)}
  }else renderDeclaredField(body,{key,label:'可选'+parameter.label,default:globals,options:parameter.options},record);
 }
 choiceRefreshers.add(render);render();parent.append(field);
}
function renderHotkey(parent,parameter,config){
 const value=config[parameter.key]===undefined?clone(parameter.default):config[parameter.key];
 const card=make('section','parameter-card');const heading=make('div','parameter-heading');heading.append(make('h3','',parameter.label));card.append(heading);
 const shortcut={...clone(parameter.default),...(value||{})};const optional=Object.hasOwn(parameter.default,'bind');
 if(optional)shortcut.bind=config[parameter.key]===undefined?parameter.default.bind:(value!==false&&value.bind!==false);else delete shortcut.bind;shortcut.mods=shortcut.mods||[];
 const save=()=>{config[parameter.key]=clone(shortcut);mark();updatePreview()};
 if(optional){const label=make('label','switch');const enabled=make('input');enabled.type='checkbox';enabled.checked=shortcut.bind!==false;enabled.setAttribute('aria-label','启用'+parameter.label);enabled.onchange=()=>{shortcut.bind=enabled.checked;save()};label.append(enabled,make('span','',parameter.enableLabel||'启用'));heading.append(label);}
 const row=make('div','shortcut-row');card.append(row);
 const modifiers=make('div','modifiers');const symbols={ctrl:'⌃',alt:'⌥',shift:'⇧',cmd:'⌘'};
 for(const [key,title]of [['ctrl','Control'],['alt','Option'],['shift','Shift'],['cmd','Command']]){
  const label=make('label','modifier');const toggle=make('input');toggle.type='checkbox';toggle.checked=shortcut.mods.includes(key);toggle.setAttribute('aria-label',title);
  toggle.onchange=()=>{shortcut.mods=toggle.checked?[...shortcut.mods,key]:shortcut.mods.filter(item=>item!==key);save()};label.append(toggle,make('span','',symbols[key]+' '+title));modifiers.append(label);
 }
 row.append(modifiers);
 const key=make('input','key-input');key.type='text';key.value=shortcut.key;key.setAttribute('aria-label','快捷键主键');key.oninput=()=>{shortcut.key=key.value;save()};row.append(key);
 const preview=make('div','shortcut-preview');const keys=make('kbd');preview.setAttribute('aria-label','当前快捷键');preview.append(keys);row.append(preview);
 function updatePreview(){preview.className='shortcut-preview'+(optional&&shortcut.bind===false?' inactive':'');keys.textContent=['ctrl','alt','shift','cmd'].filter(mod=>shortcut.mods.includes(mod)).map(mod=>symbols[mod]).join('')+' '+String(shortcut.key||'').toUpperCase();}
 updatePreview();parent.append(card);
}
function defaultRecord(fields){
 const record={};
 for(const field of fields){
  if(!field.key&&field.fields)Object.assign(record,defaultRecord(field.fields));
  else if(field.key&&!field.selection&&!(field.omitEmpty&&field.default&&typeof field.default==='object'&&!Object.keys(field.default).length))record[field.key]=clone(field.default);
 }
 return record;
}
function renderMap(parent,parameter,config){
 const value=config[parameter.key]===undefined?parameter.default:config[parameter.key];
 const rows=Object.entries(value||{}).map(([source,targets])=>({source,targets:clone(targets)}));
 const container=make('div','map-list');container.append(make('h3','',parameter.label));const list=make('div');const add=make('button','','＋ 添加'+(parameter.itemLabel||parameter.label));add.type='button';
 const cleanups=[];
 const save=()=>{config[parameter.key]=Object.fromEntries(rows.map(row=>[row.source,clone(row.targets)]));mark()};
 function draw(){
  for(const cleanup of cleanups)cleanup();cleanups.length=0;list.replaceChildren();
  if(!rows.length)list.append(make('p','empty','暂无'+parameter.label+'，点击下方添加。'));
  rows.forEach((row,index)=>{
   const card=make('section','parameter-card');const heading=make('div','parameter-heading');heading.append(make('h3','',(parameter.itemLabel||parameter.label)+' '+(index+1)));
   const remove=make('button','list-remove','×');remove.type='button';remove.setAttribute('aria-label','删除'+parameter.label+' '+(index+1));remove.onclick=()=>{rows.splice(index,1);save();draw()};heading.append(remove);card.append(heading);
   let previousSource=row.source;
   renderDeclaredField(card,{...parameter.keyField,key:'source'},row,parameter.key+'-'+index,()=>{
    if(rows.some(other=>other!==row&&other.source===row.source)){row.source=previousSource;draw();notice('该分组名称已存在，请直接编辑已有分组。',true);return;}
    previousSource=row.source;save();
   },cleanups);
   renderDeclaredField(card,{...parameter.valueField,key:'targets'},row,parameter.key+'-'+index,save,cleanups);
   list.append(card);
  });
 }
 add.onclick=()=>{
  if(rows.some(row=>row.source==='')){notice('请先填写当前分组的'+parameter.keyField.label+'。',true);return;}
  const resource=optionResources.get(parameter.keyField.options);
  const source=(resource?.options||[]).find(option=>!rows.some(row=>row.source===option.value))?.value||parameter.keyField.default||'';
  rows.push({source,targets:clone(parameter.valueField.default)});save();draw();
 };
 draw();container.append(list,add);parent.append(container);
}
function renderRecords(parent,parameter,config,root){
 const records=Array.isArray(config[parameter.key])?config[parameter.key]:[];
 const container=make('div','record-list');const list=make('div');const itemLabel=parameter.itemLabel||parameter.label;
 const add=make('button','','＋ 添加'+itemLabel);add.type='button';
 const save=()=>{config[parameter.key]=records;mark()};
 function draw(){
  choiceRefreshers.clear();list.replaceChildren();
  if(!records.length)list.append(make('p','empty','暂无'+parameter.label+'，点击下方添加。'));
  records.forEach((record,index)=>{
   const card=make('section','parameter-card');const heading=make('div','parameter-heading');heading.append(make('h3','',parameter.label+' '+(index+1)));
   const actions=make('div','record-actions');
   for(const field of parameter.fields.filter(field=>field.header)){
    const label=make('label','switch');const toggle=make('input');toggle.type='checkbox';toggle.checked=record[field.key]===undefined?field.default:record[field.key];toggle.setAttribute('aria-label',field.label+' '+(index+1));
    toggle.onchange=()=>{record[field.key]=toggle.checked;save()};label.append(toggle,make('span','',field.label));actions.append(label);
   }
   const remove=make('button','list-remove','×');remove.type='button';remove.setAttribute('aria-label','删除'+itemLabel+' '+(index+1));remove.onclick=()=>{records.splice(index,1);save();draw()};actions.append(remove);heading.append(actions);card.append(heading);
   const body=make('div',parameter.layout==='columns'?'parameter-columns':'parameter-body');
   renderParameters(body,parameter.fields.filter(field=>!field.header),record,root,parameter.key+'-'+index,true);
   card.append(body);list.append(card);
  });
 }
 add.onclick=()=>{records.push(parameter.template?clone(parameter.template):defaultRecord(parameter.fields));save();draw()};
 draw();container.append(list,add);parent.append(container);
}
function renderParameters(parent,parameters,config,root=config,scope='',nested=false){
 for(const parameter of parameters){
  if(parameter.key&&Array.isArray(parameter.fields)){renderRecords(parent,parameter,config,root);continue;}
  if(Array.isArray(parameter.fields)){
   const folded=parameter.collapsed!==undefined;const group=make(folded?'details':'section',nested?'parameter-group':'parameter-card');
   if(folded){group.className+=' collapsible-parameters';group.open=!parameter.collapsed;}
   group.append(make(folded?'summary':nested?'h4':'h3','',parameter.label));
   const body=make('div',parameter.layout==='columns'?'parameter-columns':'parameter-body');
   renderParameters(body,parameter.fields,config,root,scope,true);group.append(body);parent.append(group);continue;
  }
  if(parameter.control==='hotkey'){renderHotkey(parent,parameter,config);continue;}
  if(parameter.control==='map'){renderMap(parent,parameter,config);continue;}
  if(parameter.selection){renderSelection(parent,parameter,config,root);continue;}
  if(nested)renderDeclaredField(parent,parameter,config,scope);
  else{const card=make('section','parameter-card');renderDeclaredField(card,parameter,config,scope);parent.append(card)}
 }
}
function renderEditor(){
 choiceRefreshers.clear();choiceSources.clear();for(const resource of optionResources.values())resource.listeners.clear();
 const item=entry();
 const content=document.getElementById('content');content.replaceChildren();const enabledControl=document.getElementById('script-enabled');enabledControl.replaceChildren();if(!item)return;
 if(!drafts[selected])drafts[selected]={enabled:item.enabled,options:normalize(clone(item.options),'options')};
 const draft=drafts[selected];const header=make('header');header.append(make('h2','',item.title));
 const label=make('label','switch');const toggle=make('input');toggle.type='checkbox';toggle.checked=draft.enabled;toggle.onchange=()=>{draft.enabled=toggle.checked;mark()};label.append(toggle,make('span','','启用脚本'));enabledControl.append(label);content.append(header,make('p','description',item.description));
 content.append(make('p','status',item.error?'上次应用失败':item.running?'正在运行':'已关闭'));
 if(item.error)content.append(make('p','errorbox',item.error));
 if(item.installation){
  const guide=make('details','parameter-card installation-guide');guide.append(make('summary','',item.installation.title||'安装、配置与测试'));
  if(item.installation.description)guide.append(make('p','',item.installation.description));
  guide.append(make('pre','install-command',item.installation.command));
  if(item.installation.notes)guide.append(make('p','',item.installation.notes));
  content.append(guide);
 }
 const form=make('form');form.id='settings-form';form.onsubmit=e=>e.preventDefault();
 if(item.parameters){
  collectChoiceSources(item.parameters);
  if(Array.isArray(item.parameters)&&item.parameters.length)renderParameters(form,item.parameters,draft.options);
  else form.append(make('p','empty','此脚本无需配置，启用后自动运行。'));
 }else renderCollection(form,draft.options,[],v=>draft.options=v);
 content.append(form);
 document.getElementById('reset').disabled=busy;document.getElementById('save').disabled=busy;
 document.getElementById('save').textContent='保存并应用';
 if(!busy)notice(dirty[selected]?'有未保存的修改。':'修改后点击「保存并应用」，只更新当前脚本。');
}
window.receiveState=payload=>{
 modules=payload.modules;busy=false;
 if(payload.savedID){delete drafts[payload.savedID];delete dirty[payload.savedID];}
 if(!selected||!modules.some(item=>item.id===selected))selected=modules[0]?.id;
 renderNavigation();renderEditor();if(payload.message)notice(payload.message,!payload.success);
};
document.getElementById('save').onclick=()=>{
 if(busy||!selected)return;const form=document.getElementById('settings-form');if(!form.reportValidity())return;
 busy=true;document.getElementById('save').disabled=true;document.getElementById('reset').disabled=true;notice('正在应用…');
 send({action:'save',id:selected,...drafts[selected]});
};
document.getElementById('reset').onclick=()=>{
 const item=entry();drafts[selected]={enabled:item.defaults.enabled,options:normalize(clone(item.defaults.options),'options')};mark();renderEditor();notice('已填入默认设置，保存后生效。');
};
document.getElementById('reload-config').onclick=()=>send({action:'reload'});
document.getElementById('open-console').onclick=()=>send({action:'openConsole'});
send({action:'ready'});
</script>
</html>
